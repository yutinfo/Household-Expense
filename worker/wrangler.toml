name = "household-expense-gateway"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# Non-secret settings. Fill these in with your own values.
# Secrets are NEVER put here — use `wrangler secret put <NAME>`:
#   LINE_CHANNEL_SECRET, LINE_CHANNEL_ACCESS_TOKEN, INTERNAL_SIGNING_SECRET
[vars]
APPS_SCRIPT_URL = "https://script.google.com/macros/s/REPLACE_WITH_DEPLOYMENT_ID/exec"
ALLOWED_GROUP_ID = "REPLACE_WITH_GROUP_ID"
BACKEND_TIMEOUT_MS = "22000"

[observability]
enabled = true
